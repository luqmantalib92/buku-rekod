name: Release (live)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, e.g. v2.0.0"
        required: true
concurrency:
  group: deploy-live
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag is on main and matches APP_VERSION
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main. Merge develop into main before releasing."
            exit 1
          fi
          version=$(sed -n 's/^const APP_VERSION = "\(.*\)";/\1/p' public/js/version.js)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match APP_VERSION $version in public/js/version.js."
            exit 1
          fi
      - name: Write web config
        env:
          FIREBASE_CONFIG_JS: ${{ vars.FIREBASE_CONFIG_JS }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          test -n "$FIREBASE_CONFIG_JS" && test -n "$TMDB_API_KEY"
          printf '%s\n' "$FIREBASE_CONFIG_JS" > public/js/firebase-config.js
          printf 'const tmdbConfig = {\n  apiKey: "%s"\n};\n' "$TMDB_API_KEY" > public/js/tmdb-config.js
      - name: Check every script parses
        run: for f in public/js/*.js public/sw.js; do node --check "$f"; done
      # The key goes in the runner's temp directory, never the workspace.
      # google-github-actions/auth writes gha-creds-*.json into the checkout;
      # that is harmless only while hosting deploys public/ and nothing copies
      # the root into it. salasilah-keluarga hosts "." and published its key
      # that way, so no project keeps the key in the checkout.
      - name: Authenticate
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not set."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      # Only the commit plus the config files written above may be published.
      - name: Check nothing else will be deployed
        run: |
          extra="$(git ls-files --others public/ | grep -vxF -e public/js/firebase-config.js -e public/js/tmdb-config.js || true)"
          if [ -n "$extra" ]; then
            echo "::error::public/ has files that are not in the commit, and hosting would publish them:"
            echo "$extra"
            exit 1
          fi
          if grep -rlI '"private_key"' public/; then
            echo "::error::A file in public/ holds a private key."
            exit 1
          fi
      - name: Deploy hosting and Firestore rules
        run: npx --yes firebase-tools@15 deploy --only hosting,firestore:rules --project buku-rekod --non-interactive --message "$TAG"
      - name: Post to the Live releases issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-log --state open --json number -q '.[0].number')
          if [ -z "$issue" ]; then
            echo "::warning::No open issue labelled release-log, so no email was sent."
            exit 0
          fi
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "**$TAG is live** at https://buku-rekod.web.app

          Release notes: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG
          Deploy run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
