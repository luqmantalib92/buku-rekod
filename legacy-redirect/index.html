<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moved to Buku Rekod</title>
    <meta name="robots" content="noindex" />
    <script>
      // Keep the path and query so deep links (vehicle.html?id=…) and the
      // manifest's app shortcuts land on the same page at the new address.
      location.replace("https://buku-rekod.web.app" + location.pathname + location.search + location.hash);
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f8fafc; color: #0f172a; text-align: center; padding: 16px; }
      a { color: #0f6fb8; font-weight: 700; }
    </style>
  </head>
  <body>
    <p>Logbook is now <strong>Buku Rekod</strong>.<br /><a href="https://buku-rekod.web.app/">Open buku-rekod.web.app</a></p>
  </body>
</html>
