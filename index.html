<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garage | Service Log</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./icon-192.png" />
    <meta name="theme-color" content="#216e5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Service Log" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell" id="appContent" hidden>
      <section class="topbar" aria-label="Garage overview">
        <div>
          <p class="eyebrow app-version"></p>
          <h1>Service Log</h1>
        </div>
        <div class="topbar-actions">
          <button type="button" id="accountButton" class="account-button" aria-haspopup="true" aria-expanded="false" aria-label="Account and sign out">
            <span class="account-avatar" id="accountAvatar" aria-hidden="true">&middot;</span>
          </button>
          <div id="accountMenu" class="account-menu" role="menu" aria-label="Account" hidden>
            <a href="./index.html" class="account-link" role="menuitem">Garage</a>
            <a href="./categories.html" class="account-link" role="menuitem">Manage categories</a>
            <a href="./reminders.html" class="account-link" role="menuitem">Reminder settings</a>
            <a href="./changelog.html" class="account-link" role="menuitem">What's new</a>
            <hr class="account-divider" />
            <p class="account-email" id="accountEmail">Local mode</p>
            <p class="account-status" id="accountStatus">Saved on this device</p>
            <button type="button" id="signOutButton" class="ghost-action account-signout" role="menuitem" hidden>Sign out</button>
          </div>
        </div>
      </section>

      <section class="panel" aria-labelledby="vehicleHeading">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Setup</p>
            <h2 id="vehicleHeading">Add a vehicle</h2>
          </div>
        </div>

        <form id="vehicleForm" class="form-grid">
          <label>
            Vehicle name
            <input id="vehicleName" name="name" autocomplete="off" placeholder="Myvi, Civic, Hilux" required />
          </label>
          <label>
            Plate number
            <input id="vehiclePlate" name="plate" autocomplete="off" placeholder="ABC 1234" required />
          </label>
          <label>
            Current odometer
            <input id="vehicleOdometer" name="odometer" type="number" min="0" step="1" placeholder="85000" required />
          </label>
          <label>
            Model / year
            <input id="vehicleModel" name="model" autocomplete="off" placeholder="Optional" />
          </label>
          <label class="span-2 image-field">
            Photo (optional)
            <input id="vehicleImage" name="image" type="file" accept="image/*" />
            <p id="vehicleImageHint" class="image-hint field-hint">JPG or PNG, up to 15 MB. It's auto-compressed before saving.</p>
            <img id="vehicleImagePreview" class="image-preview" alt="Selected vehicle photo" hidden />
          </label>
          <button type="submit" class="primary-action">Add vehicle</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="garageHeading">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Your vehicles</p>
            <h2 id="garageHeading">Garage</h2>
          </div>
        </div>
        <div id="vehicleEmpty" class="empty-state" hidden>
          Add your first vehicle to start building service logs.
        </div>
        <div id="vehicleList" class="vehicle-list" aria-live="polite"></div>
      </section>
    </main>

    <template id="vehicleCardTemplate">
      <button type="button" class="vehicle-card">
        <img class="vehicle-thumb" alt="" hidden />
        <div class="vehicle-card-main">
          <div class="vehicle-card-title">
            <h3 class="vehicle-name"></h3>
            <span class="vehicle-due" hidden></span>
          </div>
          <p class="vehicle-plate"></p>
        </div>
        <dl class="vehicle-card-stats">
          <div>
            <dt>Odometer</dt>
            <dd class="vehicle-odometer"></dd>
          </div>
          <div>
            <dt>Logs</dt>
            <dd class="vehicle-count"></dd>
          </div>
          <div>
            <dt>Last service</dt>
            <dd class="vehicle-last"></dd>
          </div>
        </dl>
        <span class="vehicle-card-cta" aria-hidden="true">View logs &rarr;</span>
      </button>
    </template>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./version.js"></script>
    <script src="./firebase-config.js"></script>
    <script src="./store.js"></script>
    <script src="./garage.js"></script>
    <script src="./pull-refresh.js"></script>
  </body>
</html>
