<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>What's new | Service Log</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#ff385c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Service Log" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell" id="appContent" hidden>
      <section class="topbar" aria-label="What's new">
        <button type="button" id="backButton" class="icon-back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="topbar-actions">
          <a href="./settings.html" id="accountButton" class="account-button" aria-label="Settings" title="Settings">
            <span class="account-avatar" id="accountAvatar" aria-hidden="true">&middot;</span>
          </a>
        </div>
      </section>

      <section class="panel" aria-label="What's new">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Updates</p>
            <h2>What's new</h2>
            <p class="panel-subtitle">Recent changes to the app, newest first.</p>
          </div>
        </div>
        <div id="changelogList" class="changelog-list"></div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/store.js"></script>
    <script src="./js/changelog.js"></script>
    <script src="./js/pull-refresh.js"></script>
  </body>
</html>
