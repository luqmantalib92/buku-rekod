<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vehicles | Buku Rekod</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171c24" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Buku Rekod" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell has-fab" id="appContent" hidden>
      <section class="topbar" data-shell="brand" data-title="Vehicles" aria-label="Garage overview"></section>

      <div class="page-head">
        <div>
          <h1 class="page-title">My Garage <span class="count-badge" id="vehicleCount" hidden></span></h1>
          <p class="page-sub">Tap a vehicle to open its service logbook.</p>
        </div>
      </div>

      <section class="stat-pair" id="garageStats" aria-label="Garage summary" hidden>
        <div class="card stat-card">
          <span class="icon-tile" id="garageHealthIcon"><i data-icon="shield"></i></span>
          <div>
            <span class="stat-card-label">Garage health</span>
            <strong id="garageHealth">All good</strong>
          </div>
        </div>
        <div class="card stat-card">
          <span class="icon-tile"><i data-icon="gauge"></i></span>
          <div>
            <span class="stat-card-label">Total tracked</span>
            <strong id="garageKm">0 km</strong>
          </div>
        </div>
      </section>

      <div id="vehicleEmpty" class="empty-state" hidden>
        <span class="icon-tile"><i data-icon="car"></i></span>
        <p>Add your first vehicle to start building service logs.</p>
        <button type="button" id="emptyAddVehicle" class="primary-action"><i data-icon="plus"></i>Add vehicle</button>
      </div>
      <div id="vehicleList" class="vehicle-list" aria-live="polite"></div>

      <button type="button" id="fabAddVehicle" class="fab"><i data-icon="plus"></i>Add vehicle</button>
    </main>

    <template id="vehicleCardTemplate">
      <article class="card vehicle-card">
        <div class="vehicle-card-top">
          <button type="button" class="vehicle-open">
            <span class="vehicle-thumb-wrap">
              <i data-icon="car"></i>
              <img class="vehicle-thumb" alt="" hidden />
            </span>
            <span class="vehicle-card-id">
              <span class="vehicle-name"></span>
              <span class="vehicle-idline">
                <span class="tag vehicle-plate"></span>
                <span class="vehicle-model"></span>
              </span>
              <span class="pill vehicle-due" hidden></span>
            </span>
          </button>
          <div class="menu-wrap vehicle-actions">
            <button type="button" class="menu-btn vehicle-menu-btn" aria-label="Vehicle actions" aria-haspopup="true" aria-expanded="false"><i data-icon="more"></i></button>
            <div class="menu vehicle-menu" role="menu" hidden>
              <button type="button" class="vehicle-odometer-update" role="menuitem"><i data-icon="gauge"></i>Update odometer</button>
              <button type="button" class="vehicle-edit" role="menuitem"><i data-icon="pencil"></i>Edit details</button>
              <button type="button" class="vehicle-delete is-danger" role="menuitem"><i data-icon="trash"></i>Delete vehicle</button>
            </div>
          </div>
        </div>
        <div class="vehicle-card-stats">
          <div>
            <span class="label-caps">Odometer</span>
            <strong class="metric vehicle-odometer"></strong>
          </div>
          <div class="vehicle-last-wrap">
            <span class="label-caps">Last service</span>
            <strong class="vehicle-last"></strong>
            <span class="vehicle-last-km"></span>
          </div>
        </div>
        <p class="vehicle-card-foot vehicle-expiry" hidden><i data-icon="shield"></i><span class="vehicle-expiry-text"></span></p>
        <div class="vehicle-card-actions">
          <button type="button" class="tonal-action vehicle-log"><i data-icon="wrench"></i>Log service</button>
          <button type="button" class="primary-action vehicle-view">Details<i data-icon="arrow-right"></i></button>
        </div>
      </article>
    </template>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/shell.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/core.js"></script>
    <script src="./js/garage.store.js"></script>
    <script src="./js/garage.js"></script>
    <script src="./js/pull-refresh.js"></script>
  </body>
</html>
