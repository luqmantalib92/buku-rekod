<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reminders | Logbook</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#ff385c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Logbook" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell" id="appContent" hidden>
      <section class="topbar" data-shell="back" aria-label="Reminder settings"></section>

      <section class="panel" aria-label="Reminder settings">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Notifications</p>
            <h2>Reminder settings</h2>
            <p class="panel-subtitle">How many days before a service's due date to start reminding you, per category.</p>
          </div>
        </div>
        <form id="settingsForm">
          <div id="settingsRows" class="settings-grid"></div>
          <div class="edit-actions">
            <button type="submit" class="primary-action">Save settings</button>
            <span id="settingsSaved" class="settings-saved" role="status" hidden>Saved &check;</span>
          </div>
        </form>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/shell.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/core.js"></script>
    <script src="./js/garage.store.js"></script>
    <script src="./js/reminders.js"></script>
    <script src="./js/pull-refresh.js"></script>
  </body>
</html>
