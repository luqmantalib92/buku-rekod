<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings | Service Log</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#ff385c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Service Log" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell" id="appContent" hidden>
      <section class="topbar" data-shell="brand" aria-label="Settings"></section>

      <section class="panel" aria-label="Profile">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Account</p>
            <h2>Settings</h2>
            <p class="panel-subtitle">Your account and app preferences.</p>
          </div>
        </div>
        <div class="profile-row">
          <span class="profile-avatar" id="profileAvatar" aria-hidden="true">&middot;</span>
          <div class="profile-info">
            <p class="account-email" id="accountEmail">Local mode</p>
            <p class="account-status" id="accountStatus">Saved on this device</p>
          </div>
        </div>
        <button type="button" id="signOutButton" class="ghost-action danger-action profile-signout" hidden>Sign out</button>
      </section>

      <section class="panel" aria-label="Manage">
        <nav class="settings-menu">
          <a href="./categories.html" class="settings-link">
            <span>Manage categories</span>
            <span class="settings-link-sub">Edit service categories and their items</span>
          </a>
          <a href="./reminders.html" class="settings-link">
            <span>Reminder settings</span>
            <span class="settings-link-sub">Lead time before a service is due</span>
          </a>
          <a href="./changelog.html" class="settings-link">
            <span>What's new</span>
            <span class="settings-link-sub">Recent updates to the app</span>
          </a>
          <div class="settings-link settings-version">
            <span>Version</span>
            <span class="settings-link-sub app-version"></span>
          </div>
        </nav>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/shell.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/core.js"></script>
    <script src="./js/garage.store.js"></script>
    <script src="./js/settings.js"></script>
    <script src="./js/pull-refresh.js"></script>
  </body>
</html>
