<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Buku Rekod</title>
  <desc id="desc">A dark navy icon with three checked progress bars in blue, green and amber.</desc>
  <!-- The background bleeds to all four edges and the bars are held at 90%
       about the centre, so every part stays inside the maskable safe zone (a
       circle of 40% radius) that Android crops to. Each platform applies its
       own mask; do not pre-round this. Artwork from the Stitch export
       (stitch/icon), squared off and with its drop shadow removed. -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2d42"/>
      <stop offset="1" stop-color="#0f1724"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="120" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueProgress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenProgress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="amberProgress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <g transform="translate(256 256) scale(.9) translate(-256 -256)">
    <!-- Blue bar, ~72% filled -->
    <g transform="translate(76 126)">
      <circle cx="28" cy="28" r="28" fill="#0284c7" fill-opacity="0.2"/>
      <circle cx="28" cy="28" r="26" fill="#0284c7" fill-opacity="0.3"/>
      <path d="M19 28.5L25 34.5L37 21.5" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(76 3)">
        <rect width="284" height="50" rx="25" fill="#e0f2fe" fill-opacity="0.88"/>
        <rect width="206" height="50" rx="25" fill="url(#blueProgress)"/>
        <rect x="12" y="5" width="180" height="8" rx="4" fill="#fff" opacity="0.25"/>
      </g>
    </g>

    <!-- Green bar, ~50% filled -->
    <g transform="translate(76 230)">
      <circle cx="28" cy="28" r="28" fill="#059669" fill-opacity="0.2"/>
      <circle cx="28" cy="28" r="26" fill="#059669" fill-opacity="0.3"/>
      <path d="M19 28.5L25 34.5L37 21.5" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(76 3)">
        <rect width="284" height="50" rx="25" fill="#d1fae5" fill-opacity="0.88"/>
        <rect width="142" height="50" rx="25" fill="url(#greenProgress)"/>
        <rect x="12" y="5" width="118" height="8" rx="4" fill="#fff" opacity="0.25"/>
      </g>
    </g>

    <!-- Amber bar, ~26% filled -->
    <g transform="translate(76 334)">
      <circle cx="28" cy="28" r="28" fill="#d97706" fill-opacity="0.2"/>
      <circle cx="28" cy="28" r="26" fill="#d97706" fill-opacity="0.3"/>
      <path d="M19 28.5L25 34.5L37 21.5" fill="none" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(76 3)">
        <rect width="284" height="50" rx="25" fill="#fef3c7" fill-opacity="0.88"/>
        <rect width="76" height="50" rx="25" fill="url(#amberProgress)"/>
        <rect x="12" y="5" width="54" height="8" rx="4" fill="#fff" opacity="0.25"/>
      </g>
    </g>
  </g>
</svg>
