<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home | Buku Rekod</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171c24" media="(prefers-color-scheme: dark)" />
    <script src="./js/theme.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Buku Rekod" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell has-fab" id="appContent" hidden>
      <section class="topbar" data-shell="brand" data-title="Home" aria-label="Home"></section>

      <div id="homeEmpty" class="empty-state" hidden>
        <span class="icon-tile"><i data-icon="car"></i></span>
        <p>Add your first vehicle to start building service logs.</p>
        <button type="button" id="homeEmptyAction" class="primary-action"><i data-icon="plus"></i>Add vehicle</button>
      </div>

      <div class="menu-wrap vehicle-picker" id="vehiclePicker" hidden>
        <button type="button" id="vehiclePickerButton" class="vehicle-picker-btn" aria-haspopup="true" aria-expanded="false">
          <span class="vehicle-picker-icon" aria-hidden="true"><i data-icon="car"></i></span>
          <span class="vehicle-picker-text">
            <span class="vehicle-picker-label">Vehicle</span>
            <span class="vehicle-picker-name"><span id="vehiclePickerName"></span><span class="tag" id="vehiclePickerPlate" hidden></span></span>
          </span>
          <i data-icon="chevron-down" class="vehicle-picker-chevron"></i>
        </button>
        <div id="vehiclePickerMenu" class="menu vehicle-picker-menu" role="menu" aria-label="Choose vehicle" hidden></div>
      </div>

      <div id="vehicleSlot" aria-live="polite"></div>

      <section class="card" id="calendarSection" aria-label="Service calendar">
        <div class="cal-head">
          <div class="cal-head-title">
            <h2 id="calTitle" class="cal-title" aria-live="polite">Month</h2>
            <button type="button" id="calToday" class="cal-today-btn">Today</button>
          </div>
          <div class="cal-nav">
            <button type="button" id="calPrev" class="cal-nav-btn" aria-label="Previous month"><i data-icon="chevron-left"></i></button>
            <button type="button" id="calNext" class="cal-nav-btn" aria-label="Next month"><i data-icon="chevron-right"></i></button>
          </div>
        </div>
        <div id="calGrid" class="cal-grid" role="grid" aria-label="Month calendar"></div>
        <div class="cal-legend" aria-hidden="true">
          <span><i class="cal-dot cal-dot-overdue"></i>Overdue</span>
          <span><i class="cal-dot cal-dot-due-soon"></i>Due soon</span>
          <span><i class="cal-dot cal-dot-ok"></i>Upcoming</span>
          <span><i class="cal-dot cal-dot-today"></i>Today</span>
        </div>
        <div id="calDayDetail" class="cal-day-detail" hidden>
          <p id="calDayTitle" class="cal-day-detail-title"></p>
          <div id="calDayList" class="due-list"></div>
        </div>
      </section>

      <section class="section" id="scheduleSection" aria-labelledby="scheduleHeading">
        <div class="section-head">
          <div>
            <h2 class="section-title" id="scheduleHeading">Upcoming &amp; due</h2>
            <p class="section-sub" id="scheduleSub">What's coming up for this vehicle, most urgent first.</p>
          </div>
        </div>
        <div id="scheduleEmpty" class="empty-state" hidden>
          <span class="icon-tile"><i data-icon="calendar"></i></span>
          <p>Nothing scheduled. Add a next-service date to a record to start tracking what's next.</p>
        </div>
        <div id="scheduleList" class="due-list" aria-live="polite"></div>
      </section>

      <button type="button" id="fabAddRecord" class="fab"><i data-icon="plus"></i>Add record</button>
    </main>

    <template id="vehicleCardTemplate">
      <article class="card vehicle-card">
        <div class="vehicle-card-top">
          <button type="button" class="vehicle-open">
            <span class="vehicle-thumb-wrap">
              <i data-icon="car"></i>
              <img class="vehicle-thumb" alt="" hidden />
            </span>
            <span class="vehicle-card-id">
              <span class="vehicle-name"></span>
              <span class="vehicle-idline">
                <span class="tag vehicle-plate"></span>
                <span class="vehicle-model"></span>
              </span>
              <span class="pill vehicle-due" hidden></span>
            </span>
          </button>
          <div class="menu-wrap vehicle-actions">
            <button type="button" class="menu-btn vehicle-menu-btn" aria-label="Vehicle actions" aria-haspopup="true" aria-expanded="false"><i data-icon="more"></i></button>
            <div class="menu vehicle-menu" role="menu" hidden>
              <button type="button" class="vehicle-odometer-update" role="menuitem"><i data-icon="gauge"></i>Update odometer</button>
              <button type="button" class="vehicle-edit" role="menuitem"><i data-icon="pencil"></i>Edit details</button>
              <button type="button" class="vehicle-delete is-danger" role="menuitem"><i data-icon="trash"></i>Delete vehicle</button>
            </div>
          </div>
        </div>
        <div class="vehicle-card-stats">
          <div>
            <span class="label-caps">Odometer</span>
            <strong class="metric vehicle-odometer"></strong>
          </div>
          <div class="vehicle-last-wrap">
            <span class="label-caps">Last service</span>
            <strong class="vehicle-last"></strong>
            <span class="vehicle-last-km"></span>
          </div>
        </div>
        <p class="vehicle-card-foot vehicle-expiry" hidden><i data-icon="shield"></i><span class="vehicle-expiry-text"></span></p>
        <div class="vehicle-card-actions">
          <button type="button" class="tonal-action vehicle-log"><i data-icon="wrench"></i>Log service</button>
          <button type="button" class="primary-action vehicle-view">Details<i data-icon="arrow-right"></i></button>
        </div>
      </article>
    </template>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/shell.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/core.js"></script>
    <script src="./js/garage.store.js"></script>
    <script src="./js/agenda.js"></script>
    <script src="./js/pull-refresh.js"></script>
  </body>
</html>
