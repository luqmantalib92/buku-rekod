<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home | Service Log</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#ff385c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Service Log" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell" id="appContent" hidden>
      <section class="topbar" data-shell="brand" aria-label="Home"></section>

      <section class="panel" aria-label="Service calendar">
        <div class="cal-head">
          <button type="button" id="calPrev" class="cal-nav-btn" aria-label="Previous month">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h2 id="calTitle" class="cal-title" aria-live="polite">Month</h2>
          <button type="button" id="calNext" class="cal-nav-btn" aria-label="Next month">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div id="calGrid" class="cal-grid" role="grid" aria-label="Month calendar"></div>
        <div class="cal-legend" aria-hidden="true">
          <span><i class="cal-dot cal-dot-overdue"></i>Overdue</span>
          <span><i class="cal-dot cal-dot-due-soon"></i>Due soon</span>
          <span><i class="cal-dot cal-dot-ok"></i>Upcoming</span>
        </div>
        <div id="calDayDetail" class="cal-day-detail" hidden>
          <p id="calDayTitle" class="cal-day-detail-title"></p>
          <div id="calDayList" class="reminder-list"></div>
        </div>
      </section>

      <section class="panel" aria-label="Service history">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Logbook</p>
            <h2>Service history</h2>
            <p class="panel-subtitle">Every service you've logged, newest first.</p>
          </div>
        </div>
        <div id="historyEmpty" class="empty-state" hidden>
          <p id="historyEmptyText">No services logged yet.</p>
          <button type="button" id="historyEmptyAction" class="primary-action">Go to garage</button>
        </div>
        <div id="historyList" class="reminder-list" aria-live="polite"></div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/shell.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/store.js"></script>
    <script src="./js/agenda.js"></script>
    <script src="./js/pull-refresh.js"></script>
  </body>
</html>
