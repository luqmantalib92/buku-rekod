<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garage | Service Log</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#ff385c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Service Log" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell" id="appContent" hidden>
      <section class="topbar" aria-label="Garage overview">
        <a href="./index.html" class="brand" aria-label="Service Log">
          <img src="./assets/icon-192.png" alt="Service Log" class="brand-icon" />
        </a>
        <div class="topbar-actions">
          <a href="./settings.html" id="accountButton" class="account-button" aria-label="Settings" title="Settings">
            <span class="account-avatar" id="accountAvatar" aria-hidden="true">&middot;</span>
          </a>
        </div>
      </section>

      <section class="panel" aria-label="Garage">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Your vehicles</p>
            <h2>Garage</h2>
            <p class="panel-subtitle">Tap a vehicle to open its service logbook.</p>
          </div>
          <button type="button" id="addVehicle" class="primary-action heading-action" title="Add a new vehicle to your garage">Add vehicle</button>
        </div>
        <div id="vehicleEmpty" class="empty-state" hidden>
          <p>Add your first vehicle to start building service logs.</p>
          <button type="button" id="emptyAddVehicle" class="primary-action">Add vehicle</button>
        </div>
        <div id="vehicleList" class="vehicle-list" aria-live="polite"></div>
      </section>
    </main>

    <template id="vehicleCardTemplate">
      <button type="button" class="vehicle-card">
        <img class="vehicle-thumb" alt="" hidden />
        <div class="vehicle-card-main">
          <div class="vehicle-card-title">
            <h3 class="vehicle-name"></h3>
            <span class="vehicle-due" hidden></span>
          </div>
          <p class="vehicle-plate"></p>
        </div>
        <dl class="vehicle-card-stats">
          <div>
            <dt>Odometer</dt>
            <dd class="vehicle-odometer"></dd>
          </div>
          <div>
            <dt>Logs</dt>
            <dd class="vehicle-count"></dd>
          </div>
          <div>
            <dt>Last service</dt>
            <dd class="vehicle-last"></dd>
          </div>
        </dl>
        <span class="vehicle-card-cta" aria-hidden="true">View logs &rarr;</span>
      </button>
    </template>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/store.js"></script>
    <script src="./js/garage.js"></script>
    <script src="./js/pull-refresh.js"></script>
  </body>
</html>
