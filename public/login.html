<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in | Logbook</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#1689df" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Logbook" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel panel" aria-labelledby="authHeading">
        <div>
          <h1 id="authHeading">Logbook</h1>
          <p class="login-copy">Sign in to open your logbook.</p>
        </div>

        <form id="authForm" class="auth-form">
          <label>
            Email
            <input id="authEmail" name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <div class="input-with-affix">
              <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="6" required />
              <button type="button" id="togglePassword" class="input-affix-btn" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
          </label>
          <button type="submit" class="primary-action">Sign in</button>
          <p id="authMessage" class="auth-message" role="status"></p>
        </form>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
