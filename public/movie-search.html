<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search titles | Buku Rekod</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171c24" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Buku Rekod" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell" id="appContent" hidden>
      <section class="topbar" data-shell="brand" data-title="Search" aria-label="Search titles"></section>

      <form id="searchForm" class="search-bar" role="search">
        <i data-icon="search"></i>
        <label class="sr-only" for="searchInput">Search a movie or drama</label>
        <input
          type="search"
          id="searchInput"
          name="query"
          class="search-input"
          placeholder="Search a movie, drama or series"
          autocomplete="off"
          enterkeyhint="search"
        />
        <button type="button" id="searchClear" class="menu-btn search-clear" aria-label="Clear search" hidden><i data-icon="close"></i></button>
      </form>

      <p id="searchStatus" class="search-status" role="status" aria-live="polite" hidden></p>

      <div id="searchEmpty" class="empty-state">
        <span class="icon-tile"><i data-icon="search"></i></span>
        <p>Type at least 2 characters to search for a movie, drama or series.</p>
      </div>

      <div id="searchResults" class="result-list"></div>
    </main>

    <template id="resultCardTemplate">
      <article class="card result-card">
        <div class="poster-frame">
          <div class="poster-fallback" aria-hidden="true"><i data-icon="film"></i></div>
          <img class="poster-img" alt="" loading="lazy" hidden />
          <span class="poster-type"></span>
        </div>
        <div class="result-body">
          <h3 class="result-title"></h3>
          <p class="poster-meta"><span class="poster-year"></span></p>
          <p class="result-overview poster-overview"></p>
          <div class="result-actions">
            <button type="button" class="poster-add tonal-action"></button>
          </div>
        </div>
      </article>
    </template>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/shell.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/tmdb-config.js"></script>
    <script src="./js/core.js"></script>
    <script src="./js/tmdb.js"></script>
    <script src="./js/watchlist.store.js"></script>
    <script src="./js/movie-search.js"></script>
  </body>
</html>
