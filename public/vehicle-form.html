<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vehicle details | Service Log</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#ff385c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Service Log" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell" id="appContent" hidden>
      <section class="topbar" data-shell="back" aria-label="Vehicle details"></section>

      <section class="panel" aria-label="Vehicle details">
        <div class="panel-heading">
          <div>
            <p class="eyebrow" id="formEyebrow">Setup</p>
            <h2 id="formHeading">Add a vehicle</h2>
            <p class="panel-subtitle" id="formSubtitle">Enter the basics to add it to your garage — you can add a photo and edit anything later.</p>
          </div>
        </div>

        <form id="vehicleForm" class="form-grid">
          <label>
            <span>Vehicle name <span class="req" aria-hidden="true">*</span></span>
            <input id="vehicleName" name="name" autocomplete="off" placeholder="Myvi, Civic, Hilux" required />
          </label>
          <label>
            <span>Plate number <span class="req" aria-hidden="true">*</span></span>
            <input id="vehiclePlate" name="plate" autocomplete="off" placeholder="ABC 1234" required />
          </label>
          <label>
            <span>Current odometer <span class="req" aria-hidden="true">*</span></span>
            <input id="vehicleOdometer" name="odometer" type="number" min="0" step="1" inputmode="numeric" placeholder="85000" required />
            <p class="field-hint">Latest reading, in km.</p>
          </label>
          <label>
            Model / year
            <input id="vehicleModel" name="model" autocomplete="off" placeholder="e.g. 2018 1.5L" />
            <p class="field-hint">Optional.</p>
          </label>
          <label>
            Road tax expires
            <input id="vehicleRoadTax" name="roadTaxExpiry" type="date" />
            <p class="field-hint">Optional — you'll see a warning 30 days before.</p>
          </label>
          <label>
            Insurance expires
            <input id="vehicleInsurance" name="insuranceExpiry" type="date" />
            <p class="field-hint">Optional — you'll see a warning 30 days before.</p>
          </label>
          <label class="span-2 image-field">
            Photo (optional)
            <input id="vehicleImage" name="image" type="file" accept="image/*" />
            <p id="vehicleImageHint" class="image-hint field-hint">JPG or PNG, up to 15 MB. It's auto-compressed before saving.</p>
            <img id="vehicleImagePreview" class="image-preview" alt="Selected vehicle photo" hidden />
            <button type="button" id="removeImage" class="secondary-line" hidden>Remove photo</button>
          </label>
          <div class="span-2 edit-actions">
            <button type="submit" id="vehicleSubmit" class="primary-action">Add vehicle</button>
            <button type="button" id="cancelForm" class="ghost-action">Cancel</button>
          </div>
        </form>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/shell.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/core.js"></script>
    <script src="./js/garage.store.js"></script>
    <script src="./js/vehicle-form.js"></script>
    <script src="./js/pull-refresh.js"></script>
  </body>
</html>
