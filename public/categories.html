<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Categories | Service Log</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#ff385c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Service Log" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell" id="appContent" hidden>
      <section class="topbar" aria-label="Categories">
        <div class="topbar-title">
          <nav class="crumbs" aria-label="Breadcrumb">
            <a href="./index.html" class="crumb">Garage</a>
          </nav>
          <h1>Categories</h1>
        </div>
        <div class="topbar-actions">
          <button type="button" id="accountButton" class="account-button" aria-haspopup="true" aria-expanded="false" aria-label="Account and sign out">
            <span class="account-avatar" id="accountAvatar" aria-hidden="true">&middot;</span>
          </button>
          <div id="accountMenu" class="account-menu" role="menu" aria-label="Account" hidden>
            <a href="./index.html" class="account-link" role="menuitem">Garage</a>
            <a href="./categories.html" class="account-link" role="menuitem">Manage categories</a>
            <a href="./reminders.html" class="account-link" role="menuitem">Reminder settings</a>
            <a href="./changelog.html" class="account-link" role="menuitem">What's new</a>
            <hr class="account-divider" />
            <p class="account-email" id="accountEmail">Local mode</p>
            <p class="account-status" id="accountStatus">Saved on this device</p>
            <button type="button" id="signOutButton" class="ghost-action account-signout" role="menuitem" hidden>Sign out</button>
            <p class="account-version app-version"></p>
          </div>
        </div>
      </section>

      <div class="detail-head actions-only">
        <button type="button" id="resetCategories" class="ghost-action danger-action">Reset to defaults</button>
      </div>

      <section class="panel" aria-label="Service categories">
        <p class="panel-subtitle panel-intro">
          Rename categories and edit the items inside each. Existing records keep their
          category; deleting a category shows its past records as "Other".
        </p>

        <form id="categoryForm">
          <div id="categoryEditor" class="category-editor"></div>
          <button type="button" id="addCategory" class="secondary-line">+ Add category</button>
          <div class="edit-actions">
            <button type="submit" class="primary-action">Save categories</button>
            <span id="categoriesSaved" class="settings-saved" role="status" hidden>Saved &check;</span>
          </div>
        </form>
      </section>
    </main>

    <template id="categoryEditorTemplate">
      <div class="category-edit-card">
        <div class="category-edit-head">
          <label class="category-name-label">
            Category name
            <input class="category-name" type="text" autocomplete="off" />
          </label>
          <button type="button" class="ghost-action danger-action category-remove">Remove</button>
        </div>
        <div class="category-items"></div>
        <button type="button" class="secondary-line category-add-item">+ Add item</button>
      </div>
    </template>

    <template id="categoryItemTemplate">
      <div class="category-item-row">
        <input class="category-item-input" type="text" autocomplete="off" placeholder="Item name" />
        <button type="button" class="icon-button category-item-remove" aria-label="Remove item">Remove</button>
      </div>
    </template>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/store.js"></script>
    <script src="./js/categories.js"></script>
    <script src="./js/pull-refresh.js"></script>
  </body>
</html>
