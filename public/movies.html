<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchlist | Buku Rekod</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171c24" media="(prefers-color-scheme: dark)" />
    <script src="./js/theme.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Buku Rekod" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell has-fab" id="appContent" hidden>
      <section class="topbar" data-shell="brand" data-title="Movies" aria-label="Watchlist"></section>

      <div class="page-head">
        <div>
          <h1 class="page-title">My Watchlist <span class="count-badge" id="watchCount" hidden></span></h1>
          <p class="page-sub" id="watchSub">Titles you've saved to watch later.</p>
        </div>
      </div>

      <div id="watchlistControls" class="watchlist-controls" hidden>
        <div class="segmented" role="group" aria-label="Filter by watched state">
          <button type="button" class="segmented-btn is-active" data-filter="all" aria-pressed="true">All<span class="segmented-count" data-count="all"></span></button>
          <button type="button" class="segmented-btn" data-filter="unwatched" aria-pressed="false">To watch<span class="segmented-count" data-count="unwatched"></span></button>
          <button type="button" class="segmented-btn" data-filter="watched" aria-pressed="false">Watched<span class="segmented-count" data-count="watched"></span></button>
        </div>
        <label class="switch-row card">
          <span class="list-row-text">
            <span class="list-row-title">Group by release year</span>
            <span class="list-row-sub">Otherwise newest saved first</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="groupByYear" role="switch" />
            <span class="switch-track"></span>
          </span>
        </label>
      </div>

      <div id="watchlistEmpty" class="empty-state" hidden>
        <span class="icon-tile"><i data-icon="film"></i></span>
        <p id="watchlistEmptyText">Your watchlist is empty. Search for a movie or drama to save your first title.</p>
        <button type="button" id="emptyAddTitle" class="primary-action"><i data-icon="search"></i>Search titles</button>
      </div>

      <div id="watchlist" class="watchlist" aria-live="polite"></div>

      <button type="button" id="fabAddTitle" class="fab"><i data-icon="plus"></i>Add title</button>
    </main>

    <template id="watchlistGroupTemplate">
      <section class="watchlist-group">
        <div class="watchlist-group-head">
          <h2 class="watchlist-group-label"></h2>
          <span class="pill watchlist-group-count"></span>
        </div>
        <div class="watchlist-grid"></div>
      </section>
    </template>

    <template id="posterCardTemplate">
      <article class="poster-card">
        <div class="poster-frame">
          <div class="poster-fallback" aria-hidden="true"><i data-icon="film"></i></div>
          <img class="poster-img" alt="" loading="lazy" hidden />
          <span class="poster-type"></span>
          <span class="poster-watched-flag" hidden><i data-icon="check-circle"></i>Watched</span>
          <button type="button" class="watch-toggle poster-watch" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path class="check-mark" d="M8 12.3l2.8 2.8L16.3 9.5"/></svg>
          </button>
        </div>
        <div class="poster-body">
          <div class="poster-text">
            <h3 class="poster-title"></h3>
            <p class="poster-meta"><span class="poster-year"></span></p>
          </div>
          <button type="button" class="menu-btn poster-remove" aria-label="Remove from watchlist" title="Remove from watchlist"><i data-icon="trash"></i></button>
        </div>
      </article>
    </template>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/shell.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/tmdb-config.js"></script>
    <script src="./js/core.js"></script>
    <script src="./js/tmdb.js"></script>
    <script src="./js/watchlist.store.js"></script>
    <script src="./js/movies.js"></script>
    <script src="./js/pull-refresh.js"></script>
  </body>
</html>
