<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchlist | Logbook</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icon-192.png" />
    <meta name="theme-color" content="#1689df" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Logbook" />
  </head>
  <body>
    <div id="appLoading" class="app-loading" role="status" aria-label="Loading">
      <span class="app-loading-spinner"></span>
    </div>
    <main class="app-shell" id="appContent" hidden>
      <section class="topbar" data-shell="brand" aria-label="Watchlist"></section>

      <section class="panel" aria-label="Watchlist">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Movies</p>
            <h2>My Watchlist</h2>
            <p class="panel-subtitle">Titles you've saved to watch later.</p>
          </div>
          <button type="button" id="addTitle" class="primary-action heading-action" title="Search for a title to add">Add title</button>
        </div>

        <div id="watchlistControls" class="watchlist-controls" hidden>
          <div class="chips" role="group" aria-label="Filter by watched state">
            <button type="button" class="chip chip-on" data-filter="all">All</button>
            <button type="button" class="chip" data-filter="unwatched">To watch</button>
            <button type="button" class="chip" data-filter="watched">Watched</button>
          </div>
          <label class="watchlist-group-toggle">
            <input type="checkbox" id="groupByYear" />
            <span>Group by release year</span>
          </label>
        </div>

        <div id="watchlistEmpty" class="empty-state" hidden>
          <p id="watchlistEmptyText">Your watchlist is empty. Search for a movie or drama to save your first title.</p>
          <button type="button" id="emptyAddTitle" class="primary-action">Search titles</button>
        </div>

        <div id="watchlist" class="watchlist" aria-live="polite"></div>
      </section>

      <button type="button" id="fabAddTitle" class="fab" aria-label="Search titles" title="Search titles">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.6-3.6" /></svg>
      </button>
    </main>

    <template id="watchlistGroupTemplate">
      <div class="watchlist-group">
        <p class="watchlist-group-label"></p>
        <div class="watchlist-grid"></div>
      </div>
    </template>

    <template id="posterCardTemplate">
      <article class="poster-card">
        <div class="poster-frame">
          <img class="poster-img" alt="" loading="lazy" hidden />
          <div class="poster-fallback" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/></svg>
          </div>
          <span class="poster-watched-flag" hidden>Watched</span>
        </div>
        <div class="poster-body">
          <h3 class="poster-title"></h3>
          <p class="poster-meta">
            <span class="poster-type"></span>
            <span class="poster-year"></span>
          </p>
          <div class="poster-actions">
            <button type="button" class="poster-watch ghost-action"></button>
            <button type="button" class="poster-remove icon-only-action" aria-label="Remove from watchlist" title="Remove from watchlist">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
            </button>
          </div>
        </div>
      </article>
    </template>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./js/version.js"></script>
    <script src="./js/shell.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/tmdb-config.js"></script>
    <script src="./js/core.js"></script>
    <script src="./js/tmdb.js"></script>
    <script src="./js/watchlist.store.js"></script>
    <script src="./js/movies.js"></script>
    <script src="./js/pull-refresh.js"></script>
  </body>
</html>
